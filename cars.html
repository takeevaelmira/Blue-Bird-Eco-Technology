<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css?v=4">
    <link rel="stylesheet" href="assets/css/cars.css">
    <title data-en="Cars - Blue Bird Eco Technology" data-ar="السيارات - بلو بيرد للتكنولوجيا البيئية">
        Cars - Blue Bird Eco Technology
    </title>
</head>
<body>
    <header class="header">
        <a class="header-logo" href="index.html">
            <img class="header-logo-icon" src="assets/images/logo.png" alt="Logo">
            <span class="header-brand">Blue Bird</span>
        </a>

        <nav class="nav" aria-label="Main navigation">
            <a class="nav-link" href="index.html">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
                </svg>
                <span data-en="Home" data-ar="الرئيسية">Home</span>
            </a>
            <a class="nav-link" href="cars.html" aria-current="page">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="m5 11 1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" />
                    <path d="M3 11h18v8H3zM6 19v2m12-2v2M6 15h.01M18 15h.01" />
                </svg>
                <span data-en="Cars" data-ar="السيارات">Cars</span>
            </a>
            <a class="nav-link mobile-account-button" href="account.html" data-account-button aria-label="Account">
                <svg class="nav-icon mobile-account-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21a8 8 0 0 1 16 0" />
                </svg>
                <img class="account-avatar" alt="" hidden>
                <span class="account-avatar-fallback" aria-hidden="true" hidden></span>
                <span class="account-name" data-en="Account" data-ar="الحساب">Account</span>
            </a>
        </nav>

        <div class="header-actions">
            <button class="btn" id="settingsButton" type="button" data-en="Settings" data-ar="الإعدادات">Settings</button>
            <a class="btn account-button" href="account.html" data-account-button>
                <img class="account-avatar" alt="" hidden>
                <span class="account-avatar-fallback" aria-hidden="true" hidden></span>
                <span class="account-name" data-en="Sign in" data-ar="تسجيل الدخول">Sign in</span>
            </a>
        </div>
    </header>

    <main class="cars-page">

        <section class="cars-browser" aria-label="Car listings">
            <div class="cars-toolbar">
                <div class="cars-search-controls">
                    <label class="cars-search-label" for="carSearch" data-en="Search loaded cars" data-ar="ابحث في السيارات المحملة">
                        Search loaded cars
                    </label>
                    <input
                        id="carSearch"
                        class="cars-search"
                        type="search"
                        placeholder="Make, model or fuel"
                        autocomplete="off"
                    >
                </div>

                <div class="cars-filters">
                    <div class="cars-filter-group">
                        <label class="cars-year-label" for="yearFilter" data-en="Model year from" data-ar="سنة الموديل من">Model year from</label>
                        <select id="yearFilter" class="cars-year-filter" aria-label="Model year from">
                            <option value="2022" selected>2022+</option>
                            <option value="2023">2023+</option>
                            <option value="2024">2024+</option>
                            <option value="2025">2025+</option>
                            <option value="2026">2026+</option>
                            <option value="2027">2027+</option>
                        </select>
                    </div>

                    <div class="cars-filter-group">
                        <label class="cars-sort-label" for="carSort" data-en="Sort by" data-ar="ترتيب حسب">Sort by</label>
                        <select id="carSort" class="cars-sort">
                            <option value="recent" data-en="Recently listed" data-ar="الأحدث">Recently listed</option>
                            <option value="price-low" data-en="Price: low to high" data-ar="السعر: من الأقل إلى الأعلى">Price: low to high</option>
                            <option value="price-high" data-en="Price: high to low" data-ar="السعر: من الأعلى إلى الأقل">Price: high to low</option>
                            <option value="year" data-en="Newest model year" data-ar="أحدث سنة موديل">Newest model year</option>
                        </select>
                    </div>

                    <div class="cars-filter-group">
                        <label class="cars-currency-label" for="currencySelect" data-en="Display currency" data-ar="العملة">Display currency</label>
                        <select id="currencySelect" class="cars-currency-select" aria-label="Display currency">
                            <option value="sar" data-en="Saudi riyal (SAR)" data-ar="ريال سعودي (SAR)">Saudi riyal (SAR)</option>
                            <option value="krw" data-en="Korean won (KRW)" data-ar="وون كوري (KRW)">Korean won (KRW)</option>
                        </select>
                    </div>
                </div>

                <p id="carsCount" class="cars-count" aria-live="polite"></p>
                <p id="currencyRate" class="cars-currency-rate" aria-live="polite"></p>
            </div>

            <p id="carsStatus" class="cars-status" role="status" aria-live="polite" data-en="Loading listings..." data-ar="جارٍ تحميل السيارات...">
                Loading listings...
            </p>
            <div id="carsGrid" class="cars-grid" aria-live="polite" hidden></div>
            <button id="loadMoreButton" class="cars-load-more" type="button" hidden data-en="Load more cars" data-ar="تحميل المزيد من السيارات">
                Load more cars
            </button>
        </section>
    </main>

    <dialog id="settingsDialog">
        <form method="dialog">
            <h2 data-en="Settings" data-ar="الإعدادات">Settings</h2>
            <label for="languageSelect" data-en="Language" data-ar="اللغة">Language</label>
            <select id="languageSelect" aria-label="Language">
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
            <label for="themeSelect" data-en="Theme" data-ar="المظهر">Theme</label>
            <select id="themeSelect" aria-label="Theme">
                <option value="light" data-en="Light" data-ar="فاتح">Light</option>
                <option value="dark" data-en="Dark" data-ar="داكن">Dark</option>
            </select>
            <div>
                <button type="submit" data-en="Close" data-ar="إغلاق">Close</button>
            </div>
        </form>
    </dialog>

    <script>
        const settingsButton = document.getElementById("settingsButton");
        const settingsDialog = document.getElementById("settingsDialog");
        const languageSelect = document.getElementById("languageSelect");
        const themeSelect = document.getElementById("themeSelect");
        const searchInput = document.getElementById("carSearch");
        const yearFilter = document.getElementById("yearFilter");
        const sortSelect = document.getElementById("carSort");
        const currencySelect = document.getElementById("currencySelect");
        const currencyRate = document.getElementById("currencyRate");
        const carsGrid = document.getElementById("carsGrid");
        const carsStatus = document.getElementById("carsStatus");
        const carsCount = document.getElementById("carsCount");
        const loadMoreButton = document.getElementById("loadMoreButton");
        const pageSize = 24;
        const translatedTexts = new Map();
        let sarPerKrw = null;
        const carsState = { cars: [], count: 0, offset: 0, loading: false, error: false, hasLoaded: false };

        const savedLanguage = localStorage.getItem("language") || "en";
        const savedTheme = localStorage.getItem("theme") || "light";
        const savedCurrency = localStorage.getItem("currency") || "sar";
        languageSelect.value = savedLanguage;
        themeSelect.value = savedTheme;
        currencySelect.value = savedCurrency;
        applyLanguage(savedLanguage);
        applyTheme(savedTheme);

        settingsButton.addEventListener("click", () => settingsDialog.showModal());
        languageSelect.addEventListener("change", (event) => {
            const language = event.target.value;
            localStorage.setItem("language", language);
            applyLanguage(language);
            translateCarNames(carsState.cars, language).then(renderCars);
        });
        themeSelect.addEventListener("change", (event) => {
            localStorage.setItem("theme", event.target.value);
            applyTheme(event.target.value);
        });
        searchInput.addEventListener("input", renderCars);
        yearFilter.addEventListener("change", renderCars);
        sortSelect.addEventListener("change", renderCars);
        currencySelect.addEventListener("change", (event) => {
            localStorage.setItem("currency", event.target.value);
            renderCars();
        });
        loadMoreButton.addEventListener("click", () => loadCars());

        function applyLanguage(language) {
            document.documentElement.lang = language;
            document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

            document.querySelectorAll("[data-en][data-ar]").forEach((element) => {
                element.textContent = element.dataset[language];
            });

            document.title = document.querySelector("title").dataset[language];
            searchInput.placeholder = language === "ar" ? "العلامة التجارية أو الطراز أو الوقود" : "Make, model or fuel";
            languageSelect.setAttribute("aria-label", language === "ar" ? "اللغة" : "Language");
            themeSelect.setAttribute("aria-label", language === "ar" ? "المظهر" : "Theme");
            yearFilter.setAttribute("aria-label", language === "ar" ? "سنة الموديل من" : "Model year from");
            currencySelect.setAttribute("aria-label", language === "ar" ? "العملة" : "Display currency");
        }

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
        }

        function getLocalizedText(english, arabic) {
            return languageSelect.value === "ar" ? arabic : english;
        }

        function getCarName(car) {
            return [car.Manufacturer, car.Model, car.Badge].filter(Boolean).join(" ") || "Vehicle listing";
        }

        function getCarSpecifications(car) {
            return [
                { label: getLocalizedText("Fuel", "نوع الوقود"), value: car.FuelType },
                { label: getLocalizedText("Transmission", "ناقل الحركة"), value: car.Transmission || car.TransmissionType || car.transmission || car.transmissionName },
                { label: getLocalizedText("Color", "اللون"), value: car.Color || car.ColorName || car.color || car.colorName },
                { label: getLocalizedText("Body style", "نوع الهيكل"), value: car.BodyType || car.BodyName || car.Body || car.bodyType || car.bodyName }
            ].filter((specification) => specification.value !== undefined && specification.value !== null && String(specification.value).trim());
        }

        function getTranslatedCarName(car) {
            const name = getCarName(car);
            return translatedTexts.get(`${languageSelect.value}:${name}`) || name;
        }

        function getTranslatedCarValue(value) {
            const text = String(value || "").trim();
            return translatedTexts.get(`${languageSelect.value}:${text}`) || text;
        }

        async function translateCarNames(cars, language) {
            const texts = [...new Set([
                ...cars.map(getCarName),
                ...cars.flatMap((car) => getCarSpecifications(car).map((specification) => String(specification.value).trim()))
            ])];
            const missingTexts = texts.filter((text) => !translatedTexts.has(`${language}:${text}`));
            if (missingTexts.length === 0) return;

            for (let index = 0; index < missingTexts.length; index += 6) {
                const batch = missingTexts.slice(index, index + 6);
                const results = await Promise.all(batch.map((name) => translateCarName(name, language)));
                results.forEach((translation, resultIndex) => {
                    if (translation) translatedTexts.set(`${language}:${batch[resultIndex]}`, translation);
                });
            }
        }

        async function translateCarName(name, language) {
            const parameters = new URLSearchParams({
                client: "gtx",
                sl: "auto",
                tl: language,
                dt: "t",
                q: name
            });

            try {
                const response = await fetch(`https://translate.googleapis.com/translate_a/single?${parameters}`);
                if (!response.ok) return "";

                const data = await response.json();
                return (data[0] || [])
                    .map((group) => typeof group[0] === "string" ? group[0] : "")
                    .join("")
                    .trim();
            } catch (error) {
                return "";
            }
        }

        function isEligibleHybrid(car) {
            const year = Number(car.FormYear);
            const fuelType = String(car.FuelType || "");
            return year >= 2022 && /(?:\+전기|하이브리드)/i.test(fuelType);
        }

        function formatCarPrice(price) {
            const amountInWon = Number(price) * 10000;
            const useRiyal = currencySelect.value === "sar" && Number.isFinite(sarPerKrw);
            const amount = useRiyal ? amountInWon * sarPerKrw : amountInWon;
            const currency = useRiyal ? "SAR" : "KRW";
            return Number.isFinite(amount) && amount > 0
                ? new Intl.NumberFormat(languageSelect.value === "ar" ? "ar-SA" : "en-SA", {
                    style: "currency",
                    currency,
                    maximumFractionDigits: 0
                }).format(amount)
                : getLocalizedText("Price on listing", "السعر في الإعلان");
        }

        async function loadExchangeRate() {
            try {
                const response = await fetch("https://open.er-api.com/v6/latest/KRW");
                if (!response.ok) throw new Error("Exchange rate unavailable");
                const data = await response.json();
                sarPerKrw = Number(data.rates?.SAR);
                if (!Number.isFinite(sarPerKrw)) throw new Error("SAR rate missing");
                currencyRate.textContent = getLocalizedText(
                    `1 KRW = ${sarPerKrw.toFixed(6)} SAR · Updated ${data.time_last_update_utc.slice(5, 16)}`,
                    `١ وون = ${sarPerKrw.toFixed(6)} ريال · تحديث ${data.time_last_update_utc.slice(5, 16)}`
                );
                renderCars();
            } catch (error) {
                currencyRate.textContent = getLocalizedText(
                    "Live exchange rate unavailable; prices shown in KRW.",
                    "سعر الصرف غير متاح؛ الأسعار معروضة بالوون الكوري."
                );
                if (currencySelect.value === "sar") {
                    currencySelect.value = "krw";
                    localStorage.setItem("currency", "krw");
                }
            }
        }

        async function loadCars() {
            if (carsState.loading) return;

            carsState.loading = true;
            carsState.error = false;
            loadMoreButton.disabled = true;
            loadMoreButton.textContent = getLocalizedText("Loading...", "جارٍ التحميل...");
            if (carsState.cars.length === 0) {
                carsStatus.hidden = false;
                carsStatus.textContent = getLocalizedText("Loading car listings...", "جارٍ تحميل السيارات...");
            }

            try {
                const initialCarCount = carsState.cars.length;
                while (carsState.cars.length - initialCarCount < pageSize && (carsState.offset === 0 || carsState.offset < carsState.count)) {
                    const parameters = new URLSearchParams({
                        count: "true",
                        q: "(And.Hidden.N._.CarType.Y._.(Or.FuelType.가솔린+전기._.FuelType.LPG+전기.))",
                        sr: `|ModifiedDate|${carsState.offset}|${pageSize}`
                    });
                    const response = await fetch(`https://api.encar.com/search/car/list/premium?${parameters}`);
                    if (!response.ok) throw new Error(`Encar returned ${response.status}`);

                    const data = await response.json();
                    const results = Array.isArray(data.SearchResults) ? data.SearchResults : [];
                    carsState.offset += results.length;
                    carsState.count = Number(data.Count) || carsState.offset;
                    carsState.hasLoaded = true;

                    const eligibleCars = results.filter(isEligibleHybrid);
                    carsState.cars.push(...eligibleCars);
                    await translateCarNames(eligibleCars, languageSelect.value);
                    if (results.length === 0) break;
                }
            } catch (error) {
                carsState.error = true;
                carsStatus.hidden = false;
                carsStatus.textContent = getLocalizedText(
                    "Could not load car listings. Check your connection and try again.",
                    "تعذر تحميل السيارات. تحقق من اتصالك وحاول مرة أخرى."
                );
            } finally {
                carsState.loading = false;
                if (!carsState.error) renderCars();
                loadMoreButton.disabled = false;
                loadMoreButton.textContent = getLocalizedText(
                    carsState.error ? "Try again" : "Load more cars",
                    carsState.error ? "حاول مرة أخرى" : "تحميل المزيد من السيارات"
                );
                loadMoreButton.hidden = !carsState.error && carsState.offset >= carsState.count;
            }
        }

        function renderCars() {
            const query = searchInput.value.trim().toLocaleLowerCase();
            const matchingCars = carsState.cars.filter((car) => {
                if (Number(car.FormYear) < Number(yearFilter.value)) return false;
                const searchableText = [getCarName(car), getTranslatedCarName(car), car.BadgeDetail, car.FuelType]
                    .filter(Boolean)
                    .join(" ")
                    .toLocaleLowerCase();
                return searchableText.includes(query);
            });

            if (sortSelect.value === "price-low") matchingCars.sort((a, b) => Number(a.Price) - Number(b.Price));
            if (sortSelect.value === "price-high") matchingCars.sort((a, b) => Number(b.Price) - Number(a.Price));
            if (sortSelect.value === "year") matchingCars.sort((a, b) => Number(b.FormYear) - Number(a.FormYear));

            carsGrid.replaceChildren(...matchingCars.map(createCarCard));
            document.dispatchEvent(new Event("bluebird-favorites-refresh"));
            carsGrid.hidden = matchingCars.length === 0;
            carsCount.textContent = getLocalizedText(
                `${matchingCars.length} shown · hybrid · ${yearFilter.value}+`,
                `${matchingCars.length.toLocaleString()} معروضة · هجينة · موديل ${yearFilter.value} فما بعد`
            );

            if (matchingCars.length > 0) {
                carsStatus.hidden = true;
            } else if (!carsState.loading && !carsState.error) {
                carsStatus.hidden = false;
                carsStatus.textContent = getLocalizedText(
                    carsState.cars.length === 0 && carsState.hasLoaded
                        ? "No hybrid listings from 2022 onward are available."
                        : carsState.cars.length === 0
                            ? "Loading car listings..."
                            : "No loaded cars match your search.",
                    carsState.cars.length === 0 && carsState.hasLoaded
                        ? "لا توجد سيارات هجينة من موديل 2022 فما بعد."
                        : carsState.cars.length === 0
                            ? "جارٍ تحميل السيارات..."
                            : "لا توجد سيارات محملة تطابق بحثك."
                );
            }
        }

        function createCarCard(car) {
            const card = document.createElement("article");
            card.className = "car-card";
            const link = document.createElement("a");
            link.className = "car-card-link";
            link.href = `car-details.html?id=${encodeURIComponent(car.Id)}`;
            link.setAttribute("aria-label", getLocalizedText("View car details", "عرض تفاصيل السيارة"));

            const imageFrame = document.createElement("div");
            imageFrame.className = "car-image-frame";
            const photo = Array.isArray(car.Photos)
                ? car.Photos.find((item) => item.type === "001") || car.Photos[0]
                : null;
            if (photo?.location) {
                const image = document.createElement("img");
                image.className = "car-image";
                image.src = `https://ci.encar.com${photo.location}`;
                image.alt = [car.Manufacturer, car.Model, car.Badge].filter(Boolean).join(" ");
                image.loading = "lazy";
                image.onerror = () => image.remove();
                imageFrame.append(image);
            } else {
                imageFrame.classList.add("car-image-frame--empty");
                imageFrame.textContent = getLocalizedText("Photo unavailable", "الصورة غير متاحة");
            }

            const info = document.createElement("div");
            info.className = "car-info";
            const title = document.createElement("h2");
            title.className = "car-title";
            title.textContent = getTranslatedCarName(car);

            const price = document.createElement("p");
            price.className = "car-price";
            price.textContent = formatCarPrice(car.Price);

            const details = document.createElement("p");
            details.className = "car-details";
            const year = car.FormYear || "—";
            const mileage = Number(car.Mileage);
            const mileageText = Number.isFinite(mileage)
                ? `${new Intl.NumberFormat(languageSelect.value === "ar" ? "ar-SA" : "en-US").format(mileage)} ${getLocalizedText("km", "كم")}`
                : "—";
            details.textContent = `${year} · ${mileageText}`;

            const specifications = document.createElement("p");
            specifications.className = "car-specifications";
            specifications.textContent = getCarSpecifications(car)
                .map(({ label, value }) => `${label}: ${getTranslatedCarValue(value)}`)
                .join(" · ");

            const source = document.createElement("span");
            source.className = "car-source";
            source.textContent = getLocalizedText("View details", "عرض التفاصيل");
            info.append(title, price, details);
            info.append(source);
            link.append(imageFrame, info);
            if (specifications.textContent) link.append(specifications);
            const favoriteButton = document.createElement("button");
            favoriteButton.type = "button";
            favoriteButton.className = "favorite-button";
            favoriteButton.dataset.favoriteButton = "";
            favoriteButton.dataset.carId = String(car.Id);
            favoriteButton.dataset.title = getTranslatedCarName(car);
            favoriteButton.dataset.image = photo?.location ? `https://ci.encar.com${photo.location}` : "";
            favoriteButton.dataset.year = String(car.FormYear || "");
            favoriteButton.dataset.price = String(car.Price || "");
            favoriteButton.textContent = "☆";
            favoriteButton.setAttribute("aria-pressed", "false");
            favoriteButton.setAttribute("aria-label", getLocalizedText("Add to favorites", "إضافة إلى المفضلة"));
            card.append(link, favoriteButton);
            return card;
        }

        loadExchangeRate();
        loadCars();
    </script>
    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
