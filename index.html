<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <title data-en="Home - Blue Bird Eco Technology" data-ar="الرئيسية - بلو بيرد للتكنولوجيا البيئية">
        Home - Blue Bird Eco Technology
    </title>
</head>
<body>

    <header class="header">
        <a class="header-logo" href="index.html">
            <img class="header-logo-icon" src="assets/images/logo.png" alt="Logo">
            <span class="header-brand">Blue Bird</span>
        </a>

        <nav class="nav">
            <a
                class="nav-link"
                href="index.html"
                data-en="Home"
                data-ar="الرئيسية"
            >
                Home
            </a>

            <a
                class="nav-link"
                href="cars.html"
                data-en="Cars"
                data-ar="السيارات"
            >
                Cars
            </a>
        </nav>

        <div class="header-actions">
            <button
                class="btn"
                id="settingsButton"
                type="button"
                data-en="Settings"
                data-ar="الإعدادات"
            >
                Settings
            </button>

            <a
                class="btn"
                href="#"
                data-en="Sign in"
                data-ar="تسجيل الدخول"
            >
                Sign in
            </a>
        </div>
    </header>

    <section class="hero">
        <main class="hero-content">
            <div class="hero-images">
                <img
                    class="hero-home-image"
                    src="assets/images/home_img.png"
                    alt="Eco technology"
                >
            </div>

            <p class="hero-subtitle" data-en="Eco Tech LLC" data-ar="إيكو تك ذ.م.م.">
                Eco Tech LLC
            </p>

            <a
                href="cars.html"
                class="btn btn--shadow"
                data-en="Go to Cars"
                data-ar="الانتقال إلى السيارات"
            >
                Go to Cars
            </a>
        </main>
    </section>

    <section class="section  section--light">
        <div class="container">
            <div class="info">
                <div class="info-image">
                    <img src="assets/images/gps.png" style="width: 100%; max-width: 300px; height: auto; display: block;" alt="GPS Image">
                </div>
                <div class="info-content">
                    <h1
                        class="info-title"
                        data-en="Cross-Border Tracking"
                        data-ar="التتبع عبر الحدود"
                    >
                        Cross-Border Tracking
                    </h1>

                    <div class="info-text">
                        <p
                            data-en="Real-time visibility of vehicle transit from Korea, through preparation hubs in Dubai Free Zones, to the final customer in KSA."
                            data-ar="رؤية فورية لحركة المركبات من كوريا، مرورًا بمراكز التجهيز في المناطق الحرة بدبي، وصولًا إلى العميل النهائي في المملكة العربية السعودية."
                        >
                            Real-time visibility of vehicle transit from Korea,
                            through preparation hubs in Dubai Free Zones, to the
                            final customer in KSA.
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <ul class="steps">
            <li class="steps-item">
                <div class="steps-num">01</div>
                <div class="steps-text" data-en="Step 1" data-ar="الخطوة 1">
                    Step 1
                </div>
            </li>
            <li class="steps-item">
                <div class="steps-num">02</div>
                <div class="steps-text" data-en="Step 2" data-ar="الخطوة 2">
                    Step 2
                </div>
            </li>
            <li class="steps-item">
                <div class="steps-num">03</div>
                <div class="steps-text" data-en="Step 3" data-ar="الخطوة 3">
                    Step 3
                </div>
            </li>
        </ul>
    </section>

    <dialog id="settingsDialog">
        <form method="dialog">
            <h2 data-en="Settings" data-ar="الإعدادات">
                Settings
            </h2>

            <label for="languageSelect" data-en="Language" data-ar="اللغة">
                Language
            </label>

            <select id="languageSelect" aria-label="Language">
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>

            <label for="themeSelect" data-en="Theme" data-ar="المظهر">
                Theme
            </label>

            <select id="themeSelect" aria-label="Theme">
                <option
                    value="light"
                    data-en="Light"
                    data-ar="فاتح"
                >
                    Light
                </option>
                <option
                    value="dark"
                    data-en="Dark"
                    data-ar="داكن"
                >
                    Dark
                </option>
            </select>

            <div>
                <button
                    type="submit"
                    data-en="Close"
                    data-ar="إغلاق"
                >
                    Close
                </button>
            </div>
        </form>
    </dialog>

    <script>
        const settingsButton = document.getElementById("settingsButton");
        const settingsDialog = document.getElementById("settingsDialog");
        const languageSelect = document.getElementById("languageSelect");
        const themeSelect = document.getElementById("themeSelect");

        const savedLanguage = localStorage.getItem("language") || "en";
        const savedTheme = localStorage.getItem("theme") || "light";

        languageSelect.value = savedLanguage;
        themeSelect.value = savedTheme;

        applyLanguage(savedLanguage);
        applyTheme(savedTheme);

        settingsButton.addEventListener("click", () => {
            settingsDialog.showModal();
        });

        languageSelect.addEventListener("change", (event) => {
            const language = event.target.value;

            localStorage.setItem("language", language);
            applyLanguage(language);
        });

        themeSelect.addEventListener("change", (event) => {
            const theme = event.target.value;

            localStorage.setItem("theme", theme);
            applyTheme(theme);
        });

        function applyLanguage(language) {
            document.documentElement.lang = language;
            document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

            document.querySelectorAll("[data-en][data-ar]").forEach((element) => {
                if (element.tagName === "OPTION") {
                    element.textContent = element.dataset[language];
                } else {
                    element.textContent = element.dataset[language];
                }
            });

            document.title = document.querySelector("title").dataset[language];

            languageSelect.setAttribute(
                "aria-label",
                language === "ar" ? "اللغة" : "Language"
            );

            themeSelect.setAttribute(
                "aria-label",
                language === "ar" ? "المظهر" : "Theme"
            );
        }

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
        }
    </script>
</body>
</html>
