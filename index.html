<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <title data-en="Blue Bird Eco Technology" data-ar="بلو بيرد للتكنولوجيا البيئية">Blue Bird Eco Technology</title>
</head>
<body>

    <header class="header">
        <a class="header-logo" href="index.html" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none;">
            <img class="header-logo-icon" src="assets/images/logo.png" alt="Logo">
            <span class="header-brand" data-en="Blue Bird" data-ar="بلو بيرد">Blue Bird</span>
        </a>

        <div class="header-actions">
            <button class="btn" id="settingsButton" type="button" data-en="Settings" data-ar="الإعدادات">
                Settings
            </button>
            <div id="authContainer" style="display: inline-block;">
                <a class="btn" id="signInBtn" href="#" data-en="Sign in" data-ar="تسجيل الدخول">Sign in</a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1 data-en="Eco-Friendly Future Mobility" data-ar="التنقل المستقبلي الصديق للبيئة">Eco-Friendly Future Mobility</h1>
            <p data-en="Discover our latest collection of electric and hybrid vehicles." data-ar="اكتشف أحدث تشكيلة من السيارات الكهربائية والهجينة.">Discover our latest collection of electric and hybrid vehicles.</p>
            <a class="btn" href="cars.html" data-en="View Catalog" data-ar="عرض الكتالوج">View Catalog</a>
        </section>
    </main>

    <dialog id="settingsDialog">
        <form method="dialog">
            <h2 data-en="Settings" data-ar="الإعدادات">Settings</h2>
            <label for="languageSelect" data-en="Language" data-ar="اللغة">Language</label>
            <select id="languageSelect" aria-label="Language">
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
            <label for="themeSelect" data-en="Theme" data-ar="المظهر">Theme</label>
            <select id="themeSelect" aria-label="Theme">
                <option value="light" data-en="Light" data-ar="فاتح">Light</option>
                <option value="dark" data-en="Dark" data-ar="داكن">Dark</option>
            </select>
            <div>
                <button type="submit" data-en="Close" data-ar="إغلاق">Close</button>
            </div>
        </form>
    </dialog>

    <script>
        fetch('/api/config')
            .then(res => res.json())
            .then(config => {
                const GOOGLE_CLIENT_ID = config.clientId;
                const authContainer = document.getElementById('authContainer');

                const urlParams = new URLSearchParams(window.location.search);
                const authCode = urlParams.get('code');

                if (authCode) {
                    const redirectUri = window.location.origin + window.location.pathname;
                    fetch('/api/auth/google', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: authCode, redirectUri: redirectUri })
                    })
                    .then(res => res.json())
                    .then(userData => {
                        if (userData && userData.name) {
                            localStorage.setItem('google_user', JSON.stringify({
                                name: userData.name,
                                picture: userData.picture || '',
                                email: userData.email || ''
                            }));
                        }
                        window.history.replaceState({}, document.title, window.location.pathname);
                        location.reload();
                    })
                    .catch(err => console.error("Google auth error:", err));
                }

                let currentUser = JSON.parse(localStorage.getItem('google_user') || 'null');

                function updateAuthUI() {
                    if (currentUser) {
                        authContainer.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 8px;">
                                ${currentUser.picture ? `<img src="${currentUser.picture}" alt="avatar" style="width: 28px; height: 28px; border-radius: 50%;">` : ''}
                                <span style="font-weight: 600; font-size: 0.95rem;">${currentUser.name}</span>
                                <button id="signOutBtn" style="background: none; border: none; color: #dc3545; cursor: pointer; font-size: 0.8rem; text-decoration: underline;">Выйти</button>
                            </div>
                        `;
                        document.getElementById('signOutBtn').addEventListener('click', () => {
                            localStorage.removeItem('google_user');
                            currentUser = null;
                            updateAuthUI();
                            location.reload();
                        });
                    } else {
                        authContainer.innerHTML = `<a class="btn" id="signInBtn" href="#">Sign in</a>`;
                        document.getElementById('signInBtn').addEventListener('click', (e) => {
                            e.preventDefault();
                            if (!GOOGLE_CLIENT_ID) {
                                alert("Google Client ID не настроен на сервере!");
                                return;
                            }
                            const redirectUri = window.location.origin + window.location.pathname;
                            const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=openid%20email%20profile`;
                            window.location.href = googleAuthUrl;
                        });
                    }
                }
                updateAuthUI();
            })
            .catch(err => console.error("Failed to load app config:", err));

        const settingsButton = document.getElementById("settingsButton");
        const settingsDialog = document.getElementById("settingsDialog");
        const languageSelect = document.getElementById("languageSelect");
        const themeSelect = document.getElementById("themeSelect");

        const savedLanguage = localStorage.getItem("language") || "en";
        const savedTheme = localStorage.getItem("theme") || "light";
        languageSelect.value = savedLanguage;
        themeSelect.value = savedTheme;
        applyLanguage(savedLanguage);
        applyTheme(savedTheme);

        settingsButton.addEventListener("click", () => settingsDialog.showModal());
        languageSelect.addEventListener("change", (e) => {
            localStorage.setItem("language", e.target.value);
            applyLanguage(e.target.value);
        });
        themeSelect.addEventListener("change", (e) => {
            localStorage.setItem("theme", e.target.value);
            applyTheme(e.target.value);
        });

        function applyLanguage(language) {
            document.documentElement.lang = language;
            document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
            document.querySelectorAll("[data-en][data-ar]").forEach(el => el.textContent = el.dataset[language]);
        }
        function applyTheme(theme) { document.documentElement.dataset.theme = theme; }
    </script>
</body>
</html>
